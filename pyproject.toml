[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-periodic-tasks"
version = "0.3.0"
description = "Periodic/cron task scheduling for django-tasks. Backend-agnostic replacement for celery-beat."
authors = [
    {name = "thelab", email = "thelabdev@thelab.co"}
]
license = {text = "ISC"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2",
    "croniter>=6.2.4",
]

[project.urls]
Homepage = "https://gitlab.com/thelabnyc/django-periodic-tasks"
Repository = "https://gitlab.com/thelabnyc/django-periodic-tasks"

[project.optional-dependencies]
django-tasks = [
    "django-tasks>=0.7",
]
rq = [
    "django-tasks[rq]",
    "django-rq",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.3",
    "coverage>=7.17.0",
    "django-stubs>=5.2.9",
    "psycopg[binary]>=3.3.6",
    "tox>=4.67.4",
    "tox-uv>=1.37.2",
    "pymdown-extensions>=12.3,<13",
    "mkautodoc>=0.2.0,<0.3",
    "zensical>=0.0.73,<0.0.74",
    "django-stubs-ext>=5.2.9,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["django_periodic_tasks"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/bin/check-docs-csp.py",
    "/bin/vendor-docs-assets.py",
    "/docs-vendor",
]

[[tool.uv.index]]
name = "thelabnyc"
url = "https://gitlab.com/api/v4/groups/269576/-/packages/pypi/simple"
explicit = true

[tool.isort]
profile = "black"
from_first = true

[tool.ruff]
line-length = 160

[tool.ruff.lint.isort]
from-first = true

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]

warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
show_error_codes = true
strict_equality = true

[tool.django-stubs]
django_settings_module = "sandbox.settings"

[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django_tasks.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django.tasks.*"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source_pkgs = ["django_periodic_tasks"]

[tool.coverage.report]
show_missing = true
ignore_errors = true

[tool.commitizen]
name = "cz_conventional_commits"
annotated_tag = true
gpg_sign = true
tag_format = "v$version"
update_changelog_on_bump = true
changelog_merge_prerelease = true
version_provider = "pep621"
version_scheme = "pep440"
version_files = [
    "pyproject.toml:version",
]
pre_bump_hooks = [
    "prek run --all-files || true",
    "uv build",
]
post_bump_hooks = [
    "git push origin master $CZ_POST_CURRENT_TAG_VERSION"
]
